controller:
  # Set password at install time:
  #   --set controller.admin.password=<your-password>
  admin:
    username: "admin"

  # Controller runs no builds — all jobs run on Kubernetes agent pods
  numExecutors: 0

  serviceType: ClusterIP

  # Ingress via ALB (same cert as the app)
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:668076964228:certificate/e4a2f397-c129-4501-b3bd-b4ab9d6f22d7
      alb.ingress.kubernetes.io/healthcheck-path: /login
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/success-codes: '200,302,403'
    hostName: jenkins.ankit.services

  # Internal URL used by agent pods to connect back — avoids ALB hairpin issues
  jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - github
    - amazon-ecr
    - aws-credentials
    - credentials-binding
    - pipeline-stage-view

serviceAccount:
  create: true
  name: jenkins
  annotations:
    # Replaced by terraform apply output — see jenkins-irsa.tf
    eks.amazonaws.com/role-arn: arn:aws:iam::668076964228:role/todo-dev-jenkins-irsa-role

persistence:
  enabled: true
  storageClass: gp2
  size: 20Gi

agent:
  enabled: true
  customJenkinsLabels:
    - jenkins-agent
  serviceAccount: jenkins
  websocket: true
  # Custom image built from app/docker/Dockerfile.jenkins-agent and pushed to ECR
  image:
    repository: 668076964228.dkr.ecr.us-east-1.amazonaws.com/jenkins-agent
    tag: latest

  # DOCKER_HOST points to the DinD sidecar running in the same pod
  envVars:
    - name: DOCKER_HOST
      value: tcp://localhost:2375

  # DinD sidecar — provides the Docker daemon for docker build/push
  yamlTemplate: |
    spec:
      containers:
      - name: dind
        image: docker:24-dind
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        volumeMounts:
        - name: docker-graph
          mountPath: /var/lib/docker
      volumes:
      - name: docker-graph
        emptyDir: {}

serviceAccountAgent:
  create: false
  name: jenkins
