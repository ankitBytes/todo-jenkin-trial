# Helm chart: jenkins/jenkins 5.9.22 (Jenkins 2.555.2-jdk17)
# Install: helm upgrade --install jenkins jenkins/jenkins -n jenkins --version 5.9.22 -f this-file --set controller.admin.password=<pw>
controller:
  # Set password at install time:
  #   --set controller.admin.password=<your-password>
  admin:
    username: "admin"

  # Controller runs no builds — all jobs run on Kubernetes agent pods
  numExecutors: 0

  serviceType: ClusterIP

  # Ingress via ALB (same cert as the app)
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:668076964228:certificate/e4a2f397-c129-4501-b3bd-b4ab9d6f22d7
      alb.ingress.kubernetes.io/healthcheck-path: /login
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/success-codes: '200,302,403'
    hostName: jenkins.ankit.services

  # Internal URL used by agent pods to connect back — avoids ALB hairpin issues
  jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - github
    - amazon-ecr
    - aws-credentials
    - credentials-binding
    - pipeline-stage-view
    - configuration-as-code

serviceAccount:
  create: true
  name: jenkins
  annotations:
    # Replaced by terraform apply output — see jenkins-irsa.tf
    eks.amazonaws.com/role-arn: arn:aws:iam::668076964228:role/todo-dev-jenkins-irsa-role

persistence:
  enabled: true
  storageClass: gp2
  size: 20Gi

agent:
  enabled: true
  customJenkinsLabels:
    - jenkins-agent
  serviceAccount: jenkins
  websocket: true
  alwaysPullImage: true
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  # Custom image built from app/docker/Dockerfile.jenkins-agent and pushed to ECR
  image:
    repository: 668076964228.dkr.ecr.us-east-1.amazonaws.com/jenkins-agent
    tag: latest

  # Kaniko sidecar replaces the privileged DinD container for rootless image builds.
  # The IRSA token (AWS_WEB_IDENTITY_TOKEN_FILE, AWS_ROLE_ARN) is injected into all
  # containers in the pod by the EKS pod identity webhook — Kaniko uses it to
  # authenticate to ECR without any stored credentials.
  yamlTemplate: |
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:v1.23.2-debug
        # Keep the container alive; the build is triggered via container('kaniko') steps
        command: ["/busybox/cat"]
        tty: true
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"

serviceAccountAgent:
  create: false
  name: jenkins
