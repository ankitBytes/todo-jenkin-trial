server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend — mirrors ALB Ingress /api rule
    location /api {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy health endpoint — mirrors ALB Ingress /health rule
    location /health {
        proxy_pass http://backend:3000;
    }

    # Serve static frontend files — mirrors ALB Ingress / rule
    location / {
        try_files $uri $uri/ /index.html;
    }
}
