services:

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  # Mirrors production ALB Ingress:
  #   /api  → backend:3000
  #   /health → backend:3000
  #   /     → static frontend files
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - todo-network
    restart: on-failure

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command: node src/app.js
    expose:
      - "3000"
    environment:
      PORT:           "3000"
      DB_NAME:        "${DB_NAME:-todos}"
      DB_HOST:        mysql
      DB_USER:        "${DB_USER:-todo_user}"
      DB_PASSWORD:    "${DB_PASSWORD:-todo_pass}"
      REDIS_HOST:     redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispass}"
      ALLOWED_ORIGIN: "http://localhost:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo-network
    restart: on-failure

  # ── MySQL ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpass}"
      MYSQL_DATABASE:      "${DB_NAME:-todos}"
      MYSQL_USER:          "${DB_USER:-todo_user}"
      MYSQL_PASSWORD:      "${DB_PASSWORD:-todo_pass}"
    ports:
      - "3306:3306"   # exposed for local DB tooling only
    volumes:
      - todo-mysql-data:/var/lib/mysql
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u${DB_USER:-todo_user}", "-p${DB_PASSWORD:-todo_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redispass}"]
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  todo-network:
    driver: bridge

# ── Persistent volumes ─────────────────────────────────────────────────────────
volumes:
  todo-mysql-data:
