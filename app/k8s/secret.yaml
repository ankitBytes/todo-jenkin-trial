apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
  annotations:
    # This secret is pre-seeded by the CI/CD pipeline (using Terraform outputs +
    # Secrets Manager values) before the Deployment is applied. The Secrets Store
    # CSI driver (SecretProviderClass: todo-app-secrets) keeps it in sync
    # with AWS Secrets Manager thereafter.
    #
    # To manually refresh from Secrets Manager:
    #   kubectl rollout restart deployment/todo-backend -n todo
type: Opaque
# data is managed by the pipeline — do not add values here
data: {}
